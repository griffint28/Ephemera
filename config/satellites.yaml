# The fleet. NORAD catalog numbers, names and operators are real, public values.
# Edit freely; then run `python -m ephemera seed-fleet`.
#
# code: short label used everywhere in the UI (unique, at most 8 characters)
#
# workload: SIMULATED. These are illustrative placeholder defaults for the data simulation, the
# same for every satellite. They have NOT yet been tuned against real pass capacity, so they may
# be too loose or too tight to show contention between schedulers. They are NOT published
# spacecraft specifications. Every number derived from them is labelled "simulated workload".
#   storage_capacity_gb          onboard recorder; data beyond it is lost
#   generation_rate_gb_per_hour  how fast routine data accumulates
#   downlink_rate_gb_per_min     what one minute of a pass brings down
satellites:
  - code: L8
    name: Landsat 8
    norad_id: 39084
    operator: USGS / NASA
    workload: {storage_capacity_gb: 150, generation_rate_gb_per_hour: 3.0, downlink_rate_gb_per_min: 1.0}
  - code: L9
    name: Landsat 9
    norad_id: 49260
